name: ExameConsciencia
options:
  bundleIdPrefix: com.daniloofrs
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
targets:
  ExameConsciencia:
    type: application
    platform: iOS
    sources:
      - path: ExameConsciencia
        excludes:
          - "**/*.json"
      - path: ExameConsciencia/Resources/examination_catalog.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniloofrs.exameconsciencia
        INFOPLIST_KEY_CFBundleDisplayName: "Exame de Consciência"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.reference"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
  ExameConscienciaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExameConscienciaTests
    dependencies:
      - target: ExameConsciencia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniloofrs.exameconsciencia.tests
        GENERATE_INFOPLIST_FILE: YES
