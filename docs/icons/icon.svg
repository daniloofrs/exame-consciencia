<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="113" fill="none" stroke="rgba(212, 175, 55, 0.2)" stroke-width="2"/>
  
  <!-- Sacred Halo -->
  <circle cx="256" cy="200" r="160" fill="url(#halo)"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="180" r="80" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.6" stroke-dasharray="8 6"/>

  <!-- Latin Cross with Serifs & Glow -->
  <g filter="url(#glow)">
    <!-- Vertical Beam -->
    <path d="M 240 90 L 272 90 L 272 400 L 240 400 Z" fill="url(#gold)"/>
    <!-- Horizontal Beam -->
    <path d="M 150 164 L 362 164 L 362 196 L 150 196 Z" fill="url(#gold)"/>
    <!-- Serifs -->
    <!-- Top -->
    <path d="M 232 90 L 280 90 L 280 96 L 232 96 Z" fill="url(#gold)"/>
    <!-- Bottom -->
    <path d="M 226 394 L 286 394 L 286 402 L 226 402 Z" fill="url(#gold)"/>
    <!-- Left -->
    <path d="M 150 156 L 150 204 L 156 204 L 156 156 Z" fill="url(#gold)"/>
    <!-- Right -->
    <path d="M 356 156 L 356 204 L 362 204 L 362 156 Z" fill="url(#gold)"/>
  </g>
</svg>
