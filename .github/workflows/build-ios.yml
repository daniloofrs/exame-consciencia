name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Test & Package iOS .ipa
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Catalog & Project Structure
        run: node scripts/validate-project.mjs

      - name: Generate Xcode Project with XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Run Unit Tests on iOS Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available iPhone | grep -E "\([0-9A-F-]{36}\)" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Using Simulator UDID: $SIMULATOR_ID"
          xcodebuild test \
            -project ExameConsciencia.xcodeproj \
            -scheme ExameConsciencia \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release App for iOS Device (Unsigned for Sideloading)
        run: |
          xcodebuild build \
            -project ExameConsciencia.xcodeproj \
            -scheme ExameConsciencia \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into ExameConsciencia.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ExameConsciencia.app Payload/
          zip -r ExameConsciencia.ipa Payload

      - name: Upload ExameConsciencia.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExameConsciencia-iOS-IPA
          path: ExameConsciencia.ipa
          retention-days: 90
